name: Transcode AV1 -> H.264

on:
  workflow_dispatch:
    inputs:
      key:
        description: "Optional: single B2 file key to transcode (empty = scan whole bucket)"
        required: false
        default: ""
  repository_dispatch:
    types: [transcode-request]

concurrency:
  group: transcode
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install b2sdk
        run: pip install --quiet b2sdk

      - name: Plan work list
        id: plan
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ACCOUNT_1_BUCKETS: ${{ vars.B2_ACCOUNT_1_BUCKETS || 'objectflix-videos' }}
          B2_APPLICATION_KEY_ID_2: ${{ secrets.B2_APPLICATION_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_ACCOUNT_2_BUCKETS: ${{ vars.B2_ACCOUNT_2_BUCKETS || 'objectflix-videos-2' }}
          CHUNK_SIZE: "3"
          SINGLE_KEY: ${{ github.event.inputs.key || github.event.client_payload.key || '' }}
        run: python scripts/b2_transcode_plan.py

  transcode:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install b2sdk
        run: pip install --quiet b2sdk

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Transcode chunk
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_APPLICATION_KEY_ID_2: ${{ secrets.B2_APPLICATION_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          MEDIA_BASE: ${{ vars.MEDIA_BASE || 'https://objectflix-api.boblinh.workers.dev/media' }}
          USE_WORKER_DOWNLOAD: ${{ vars.USE_WORKER_DOWNLOAD || '1' }}
          ITEMS_JSON: ${{ toJSON(matrix.items) }}
        run: python scripts/b2_transcode_run.py
