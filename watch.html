<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="description" content="Watch object shows on Objectflix." />
    <title>Watch — Objectflix</title>
    <link rel="icon" href="./assets/ui/objectflix-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=2" />
    <link rel="stylesheet" href="./player-test.css?v=2" />
    <link rel="stylesheet" href="./content-warning.css?v=2" />
    <link rel="stylesheet" href="./ui.css?v=2" />
    <link rel="stylesheet" href="./watch.css?v=1" />
    <script>
      try {
        const profile = JSON.parse(sessionStorage.getItem('objectflix_active_profile') || 'null');
        const theme = localStorage.getItem(`objectflix_watch_theme_${profile?.id || 'guest'}`) || 'light';
        document.documentElement.dataset.watchTheme = ['light', 'dark', 'crimson', 'purple', 'ocean'].includes(theme) ? theme : 'light';
      } catch { document.documentElement.dataset.watchTheme = 'light'; }
    </script>
  </head>
  <body class="objectflix-v2 watch-page">
    <a class="skip-link" href="#main-content">Skip to player</a>

    <header class="watch-topbar">
      <a class="watch-brand" href="browse.html" aria-label="Objectflix clubhouse">
        <img src="./assets/ui/objectflix-mark.svg" alt="" width="38" height="38" />
        <span>objectflix<span>.</span></span>
      </a>
      <div class="watch-topbar__middle"><span class="watch-topbar__spark" aria-hidden="true">✳</span><span>YOUR LITTLE CORNER OF THE OBJECT UNIVERSE</span></div>
      <div class="watch-topbar__actions">
        <label class="watch-theme-picker"><span aria-hidden="true">◐</span><span class="sr-only">Watch page theme</span>
          <select id="watchThemeSelect" aria-label="Choose watch page theme">
            <option value="light">Light</option><option value="dark">Dark</option><option value="crimson">Crimson</option><option value="purple">Purple</option><option value="ocean">Ocean</option>
          </select>
        </label>
        <a class="watch-back-link" href="browse.html"><span aria-hidden="true">←</span> Browse</a>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="view view--active" id="watchView" aria-label="Watch page"></section>
    </main>

    <footer class="watch-footer">
      <span>Small objects. Big stories.</span><span>Made by a fan, for the whole fandom. ♡</span>
    </footer>

    <script type="importmap">
      {
        "imports": {
          "jassub": "https://cdn.jsdelivr.net/npm/jassub@2.5.14/dist/jassub.js",
          "rvfc-polyfill": "https://cdn.jsdelivr.net/npm/rvfc-polyfill@1.0.8/+esm",
          "abslink": "https://cdn.jsdelivr.net/npm/abslink@1.2.2/src/abslink.js",
          "abslink/w3c": "https://cdn.jsdelivr.net/npm/abslink@1.2.2/adapters/w3c.js",
          "throughput": "https://cdn.jsdelivr.net/npm/throughput@1.0.2/+esm"
        }
      }
    </script>
    <script type="module" src="./src/player.js?v=3"></script>
    <script src="./src/env.js"></script>
    <script src="./src/config.js"></script>
    <script src="./src/api.js"></script>
    <script src="./data.js"></script>
    <script src="./src/history.js"></script>
    <script src="./src/membership-client.js"></script>
<script src="./src/shared.js"></script>
<script src="./src/content-warning.js"></script>
<script src="./src/community.js"></script>
    <script src="./src/theme.js"></script>
    <script src="./src/watch.js"></script>
    <script src="./src/assistant.js"></script>
    <script src="./src/modal-pages.js"></script>
  </body>
</html>
