<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f10" />
    <meta name="description" content="Watch object shows on Objectflix." />
    <title>Watch — Objectflix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body class="watch-page">
    <a class="skip-link" href="#main-content">Skip to player</a>

    <header class="navbar">
      <div class="navbar__left">
        <a class="logo" href="browse.html" aria-label="Back to Objectflix browse">
          <span class="logo__mark">O</span>
          <span class="logo__text">OBJECTFLIX</span>
        </a>
      </div>
      <div class="navbar__right">
        <a class="back-link" href="browse.html">Back to Browse</a>

    <script type="module" src="./src/player.js?v=3"></script>
