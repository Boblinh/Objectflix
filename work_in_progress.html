<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0612" />
    <title>Objectflix — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #0a0612;
        --text: #eef0ff;
        --muted: #8b8fad;
        --accent: #7c3aed;
        --accent-glow: rgba(124, 58, 237, 0.4);
        --fire: #f97316;
        --leaf: #22c55e;
      }

      html, body { height: 100%; overflow: hidden; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        text-align: center;
        position: relative;
      }

      
      .particles {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
      }
      .particle {
        position: absolute;
        font-size: 2rem;
        opacity: 0;
        animation: float linear infinite;
      }
      @keyframes float {
        0%   { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0.5); }
        10%  { opacity: 0.7; }
        90%  { opacity: 0.7; }
        100% { opacity: 0; transform: translateY(-10vh) rotate(360deg) scale(1); }
      }

      
      .content {
        position: relative; z-index: 1;
        max-width: 520px; padding: 40px;
      }

      .logo {
        font-size: 2.4rem; font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--fire), var(--accent), var(--leaf));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 3s ease-in-out infinite;
      }
      @keyframes shimmer {
        0%, 100% { filter: brightness(1); }
        50%      { filter: brightness(1.3); }
      }

      .tagline {
        font-size: 0.9rem; font-weight: 600;
        color: var(--muted);
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 40px;
      }

      
      .characters {
        display: flex; justify-content: center; gap: 40px;
        margin-bottom: 40px;
      }

      .char {
        width: 80px; height: 80px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-size: 2.2rem;
        animation: bob 2s ease-in-out infinite;
        position: relative;
      }
      .char--firey {
        background: radial-gradient(circle at 40% 40%, #fbbf24, #f97316, #dc2626);
        box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
        animation-delay: 0s;
      }
      .char--leafy {
        background: radial-gradient(circle at 40% 40%, #86efac, #22c55e, #15803d);
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
        animation-delay: 0.5s;
      }
      .char--firey::after {
        content: '';
        position: absolute; inset: -6px;
        border-radius: 50%;
        border: 2px solid rgba(249, 115, 22, 0.3);
        animation: pulse-ring 2s ease-in-out infinite;
      }
      .char--leafy::after {
        content: '';
        position: absolute; inset: -6px;
        border-radius: 50%;
        border: 2px solid rgba(34, 197, 94, 0.3);
        animation: pulse-ring 2s ease-in-out infinite 0.5s;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-10px); }
      }
      @keyframes pulse-ring {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50%      { transform: scale(1.15); opacity: 1; }
      }

      .speech {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 20px 24px;
        margin-bottom: 40px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }
      .speech strong { color: var(--text); }

      .speech .firey-name { color: var(--fire); font-weight: 700; }
      .speech .leafy-name { color: var(--leaf); font-weight: 700; }

      
      .status {
        display: flex; justify-content: center; gap: 8px;
        margin-bottom: 24px;
      }
      .status__dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: blink 1.4s ease-in-out infinite;
      }
      .status__dot:nth-child(2) { animation-delay: 0.2s; }
      .status__dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40%            { opacity: 1;   transform: scale(1.2); }
      }

      .footer-text {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.25);
      }
    </style>
  </head>
  <body>

    
    <div class="particles" id="particles"></div>

    <div class="content">
      <div class="logo">Objectflix</div>
      <div class="tagline">BFDI Streaming Platform</div>

      <div class="characters">
        <div class="char char--firey">🔥</div>
        <div class="char char--leafy">🍃</div>
      </div>

      <div class="speech">
        <span class="firey-name">Firey:</span> "Dude, the site's getting a <strong>massive</strong> upgrade!"
        <br /><br />
        <span class="leafy-name">Leafy:</span> "We're adding new features, more episodes, and a whole new look. Hang tight!"
      </div>

      <div class="status">
        <div class="status__dot"></div>
        <div class="status__dot"></div>
        <div class="status__dot"></div>
      </div>

      <div class="footer-text">Something awesome is cooking...</div>
    </div>

    <script>
      const emojis = ['🔥', '🍃', '⭐', '🎬', '📺', '💜', '🧊', '☁️'];
      const container = document.getElementById('particles');

      function spawn() {
        const el = document.createElement('div');
        el.className = 'particle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
        el.style.animationDuration = (8 + Math.random() * 12) + 's';
        el.style.animationDelay = Math.random() * 4 + 's';
        container.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }

      for (let i = 0; i < 15; i++) spawn();
      setInterval(spawn, 1500);
    </script>
  </body>
</html>
