<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<h1 id="ua"></h1>
<pre id="out"></pre>
<script>
const out = [];
const log = (m) => { out.push(String(m)); document.getElementById("out").textContent = out.join("\n"); };
document.getElementById("ua").textContent = navigator.userAgent + " | chrome=" + (navigator.userAgentData ? JSON.stringify(navigator.userAgentData.brands) : "n/a");
try {
  const ctx = new AudioContext();
  const p = ctx.createPanner();
  log("default panningModel: " + p.panningModel);
  log("default channelCount: " + p.channelCount + " mode: " + p.channelCountMode + " maxCh: " + p.maxChannelCount);
  try {
    p.panningModel = "HRTF";
    log("after assign 'HRTF': panningModel = " + p.panningModel);
  } catch (e) {
    log("assign 'HRTF' THREW: " + e.name + ": " + e.message);
  }
  try {
    p.panningModel = "equalpower";
    log("after assign 'equalpower': panningModel = " + p.panningModel);
  } catch (e) {
    log("assign 'equalpower' THREW: " + e.name + ": " + e.message);
  }
  ctx.close();
} catch (e) {
  log("AudioContext error: " + e.name + ": " + e.message);
}
</script>
</body>
</html>
