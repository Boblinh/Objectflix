<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f10" />
    <meta name="description" content="Sign in or sign up for Objectflix." />
    <title>Sign In — Objectflix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-page">

    <a href="./index.html" class="auth-page__logo" aria-label="Objectflix home">
      <span class="auth-brand__mark">O</span>
      <span class="auth-brand__text">OBJECTFLIX</span>
    </a>

    <div class="auth-page__panel">
      <h1 id="auth-title" class="auth-card__title">Sign In</h1>
      <p class="auth-card__subtitle" id="authSubtitle">Welcome back! Please enter your details or sign in with social accounts.</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab is-active" id="tabSignIn" type="button" role="tab" aria-selected="true">Sign In</button>
        <button class="auth-tab" id="tabSignUp" type="button" role="tab" aria-selected="false">Sign Up</button>
      </div>

      <div class="auth-alert is-hidden" id="authAlert" role="alert"></div>

      <form class="auth-form" id="authForm" novalidate>
        <div class="auth-field is-hidden" id="nameFieldGroup">
          <label for="authName" class="auth-label">Full Name</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">&#x1F464;</span>
            <input class="auth-input" id="authName" type="text" placeholder="John Doe" autocomplete="name" />
          </div>
        </div>

        <div class="auth-field">
          <label for="authEmail" class="auth-label">Email Address</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">&#x2709;</span>
            <input class="auth-input" id="authEmail" type="email" placeholder="name@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="auth-field">
          <label for="authPassword" class="auth-label">Password</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">&#x1F512;</span>
            <input class="auth-input" id="authPassword" type="password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" autocomplete="current-password" required />
            <button type="button" class="auth-toggle-password" id="authTogglePassword" aria-label="Toggle password visibility">&#x1F441;</button>
          </div>
        </div>

        <div class="auth-field is-hidden" id="confirmPasswordFieldGroup">
          <label for="authConfirmPassword" class="auth-label">Confirm Password</label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">&#x1F512;</span>
            <input class="auth-input" id="authConfirmPassword" type="password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" autocomplete="new-password" />
          </div>
        </div>

        <div class="auth-options" id="authOptionsRow">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="authRemember" checked />
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-link" id="forgotPasswordLink">Forgot password?</a>
        </div>

        <button type="submit" class="button button--primary auth-submit-btn" id="authSubmitBtn">
          <span class="auth-btn-text" id="authBtnText">Sign In</span>
        </button>
      </form>

      <div class="auth-divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <div class="auth-social-group">
        <button type="button" class="auth-social-btn auth-social-btn--google" id="loginGoogleBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google</span>
        </button>

        <button type="button" class="auth-social-btn auth-social-btn--discord" id="loginDiscordBtn">
          <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor" aria-hidden="true">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.87,53,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
          </svg>
          <span>Discord</span>
        </button>
      </div>

      <div class="auth-card__footer">
        <span id="authToggleText">New to Objectflix?</span>
        <button type="button" class="auth-toggle-link" id="authToggleModeBtn">Sign up now</button>
      </div>
    </div>

    <script src="./src/env.js"></script>
    <script src="./src/config.js"></script>
    <script type="module">
      import { Auth } from "./src/auth.js";
      Auth.init();
    </script>
  </body>
</html>
