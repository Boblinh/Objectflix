<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0612" />
    <title>Objectflix — TV Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #0a0612;
        --surface: rgba(18, 10, 36, 0.92);
        --text: #eef0ff;
        --muted: #8b8fad;
        --accent: #7c3aed;
        --accent-glow: rgba(124, 58, 237, 0.5);
        --focus-ring: 0 0 0 4px rgba(124, 58, 237, 0.85), 0 0 30px rgba(124, 58, 237, 0.35);
      }

      html, body { height: 100%; overflow: hidden; background: #000; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text);
      }

      
      .tv-player {
        position: fixed; inset: 0; background: #000;
        display: flex; flex-direction: column;
      }

      
      .tv-player__media {
        flex: 1; position: relative; display: flex;
        align-items: center; justify-content: center;
        overflow: hidden;
      }
      .tv-player__media video {
        width: 100%; height: 100%; object-fit: contain;
        background: #000;
      }
      .tv-player__media canvas.JASSUB {
        position: absolute; inset: 0; width: 100%; height: 100%;
        pointer-events: none;
      }

      
      .tv-center-play {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 100px; height: 100px; border-radius: 50%;
        background: rgba(124, 58, 237, 0.85); border: none;
        display: grid; place-items: center; cursor: pointer;
        transition: transform 0.2s, opacity 0.3s;
        box-shadow: 0 0 60px rgba(124, 58, 237, 0.4);
      }
      .tv-center-play:focus-visible { outline: none; box-shadow: var(--focus-ring); transform: translate(-50%, -50%) scale(1.1); }
      .tv-center-play svg { width: 48px; height: 48px; fill: #fff; margin-left: 4px; }
      .tv-center-play.is-hidden { opacity: 0; pointer-events: none; }

      
      .tv-loading {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; gap: 16px;
        color: var(--muted); font-size: 1rem;
      }
      .tv-loading__spinner {
        width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.08);
        border-top-color: var(--accent); border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .tv-loading.is-hidden { display: none; }

      
      .tv-ep-info {
        position: absolute; top: 32px; left: 32px; right: 32px;
        display: flex; align-items: flex-start; justify-content: space-between;
        pointer-events: none; transition: opacity 0.3s;
      }
      .tv-ep-info.is-hidden { opacity: 0; }
      .tv-ep-info__left { max-width: 60%; }
      .tv-ep-info__show {
        font-size: 0.85rem; font-weight: 700; letter-spacing: 2px;
        color: var(--accent); text-transform: uppercase; margin-bottom: 6px;
      }
      .tv-ep-info__title { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
      .tv-back-btn {
        pointer-events: all;
        padding: 10px 20px; border-radius: 10px; border: none;
        background: rgba(255,255,255,0.1); color: var(--text);
        font-size: 0.9rem; font-weight: 600; cursor: pointer;
        display: flex; align-items: center; gap: 6px;
        transition: background 0.15s;
      }
      .tv-back-btn:hover { background: rgba(255,255,255,0.18); }
      .tv-back-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

      
      .tv-controls {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 20px 36px 28px;
        background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
        transition: opacity 0.3s;
      }
      .tv-controls.is-hidden { opacity: 0; pointer-events: none; }

      
      .tv-progress-wrap {
        position: relative; width: 100%; height: 8px;
        background: rgba(255,255,255,0.12); border-radius: 4px;
        margin-bottom: 18px; cursor: pointer;
      }
      .tv-progress-wrap:focus-visible { outline: none; box-shadow: var(--focus-ring); outline-offset: 4px; border-radius: 8px; }
      .tv-progress__fill {
        height: 100%; background: var(--accent); border-radius: 4px;
        width: 0%; transition: width 0.1s linear;
      }
      .tv-progress__thumb {
        position: absolute; top: 50%; transform: translate(-50%, -50%);
        width: 18px; height: 18px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 10px var(--accent-glow);
        left: 0%; transition: left 0.1s linear;
      }

      
      .tv-controls__row {
        display: flex; align-items: center; gap: 16px;
      }

      
      .tv-ctrl {
        width: 56px; height: 56px; border-radius: 14px; border: none;
        background: rgba(255,255,255,0.08); color: var(--text);
        display: grid; place-items: center; cursor: pointer;
        transition: background 0.15s, transform 0.15s;
      }
      .tv-ctrl svg { width: 28px; height: 28px; fill: currentColor; }
      .tv-ctrl:hover { background: rgba(255,255,255,0.15); }
      .tv-ctrl:focus-visible { outline: none; box-shadow: var(--focus-ring); transform: scale(1.08); }

      .tv-ctrl--play {
        width: 72px; height: 72px; border-radius: 50%;
        background: var(--accent); color: #fff;
      }
      .tv-ctrl--play svg { width: 36px; height: 36px; margin-left: 3px; }
      .tv-ctrl--play:hover { background: #8b5cf6; }

      .tv-ctrl--skip svg { width: 24px; height: 24px; }

      
      .tv-time {
        font-size: 1rem; font-weight: 600; color: var(--muted);
        margin-left: 8px; white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .tv-time__sep { margin: 0 6px; opacity: 0.4; }

      
      .tv-volume-group {
        display: flex; align-items: center; gap: 10px;
        margin-left: auto;
      }
      .tv-volume-bar {
        width: 120px; height: 6px; border-radius: 3px;
        background: rgba(255,255,255,0.12); position: relative;
        cursor: pointer;
      }
      .tv-volume-bar:focus-visible { outline: none; box-shadow: var(--focus-ring); outline-offset: 4px; border-radius: 6px; }
      .tv-volume-bar__fill {
        height: 100%; background: var(--text); border-radius: 3px;
        width: 100%;
      }

      
      .tv-next-banner {
        position: absolute; bottom: 120px; right: 36px;
        background: var(--surface); border-radius: 16px;
        padding: 16px 24px; display: flex; align-items: center; gap: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        cursor: pointer; transition: transform 0.2s;
        opacity: 0; pointer-events: none;
      }
      .tv-next-banner.is-visible { opacity: 1; pointer-events: all; }
      .tv-next-banner:focus-visible { outline: none; box-shadow: var(--focus-ring); transform: scale(1.04); }
      .tv-next-banner__text { font-size: 0.85rem; color: var(--muted); }
      .tv-next-banner__title { font-size: 1rem; font-weight: 700; }
      .tv-next-banner__btn {
        padding: 10px 20px; border-radius: 10px; border: none;
        background: var(--accent); color: #fff; font-weight: 700;
        font-size: 0.9rem; cursor: pointer;
      }

      
      .tv-message {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; padding: 40px;
        background: var(--surface); border-radius: 20px;
        max-width: 420px;
      }
      .tv-message.is-hidden { display: none; }
      .tv-message__title { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
      .tv-message__text { color: var(--muted); line-height: 1.5; }
      .tv-ask-admins {
        margin-top: 18px; padding: 10px 22px;
        font-family: inherit; font-size: 0.95rem; font-weight: 700;
        color: #fff; background: linear-gradient(135deg, var(--accent), #5b21b6);
        border: none; border-radius: 999px; cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .tv-ask-admins:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
    </style>
  </head>
  <body>

    <div class="tv-player" id="tvPlayer" tabindex="0" aria-label="TV Video Player">

      
      <div class="tv-player__media" id="tvPlayerMedia">
        <video id="tvVideo" preload="metadata" playsinline webkit-playsinline="true" disablepictureinpicture>
          Your browser does not support HTML video.
        </video>
        <canvas id="tvSubtitleCanvas" class="JASSUB"></canvas>

        <div class="tv-loading" id="tvLoading">
          <div class="tv-loading__spinner"></div>
          <span id="tvLoadingText">Loading…</span>
        </div>

        <button class="tv-center-play" id="tvCenterPlay" type="button" aria-label="Play video">
          <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" /></svg>
        </button>

        <div class="tv-message is-hidden" id="tvMessage" role="alert">
          <div class="tv-message__title" id="tvMessageTitle"></div>
          <div class="tv-message__text" id="tvMessageText"></div>
        </div>
      </div>

      
      <div class="tv-ep-info" id="tvEpInfo">
        <div class="tv-ep-info__left">
          <div class="tv-ep-info__show" id="tvShowName"></div>
          <div class="tv-ep-info__title" id="tvEpTitle"></div>
        </div>
        <button class="tv-back-btn" id="tvBackBtn" type="button">← Back</button>
      </div>

      
      <input type="range" id="tvVolumeSlider" min="0" max="1" step="0.01" value="1"
             style="position:absolute;width:0;height:0;opacity:0;pointer-events:none" aria-hidden="true" />
      <input type="range" id="tvProgressSlider" min="0" max="100" step="0.1" value="0"
             style="position:absolute;width:0;height:0;opacity:0;pointer-events:none" aria-hidden="true" />
      <div class="tv-controls" id="tvControls">
        
        <div class="tv-progress-wrap" id="tvProgressWrap" role="slider" aria-label="Video progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="tv-progress__fill" id="tvProgressFill"></div>
          <div class="tv-progress__thumb" id="tvProgressThumb"></div>
        </div>

        
        <div class="tv-controls__row">
          
          <button class="tv-ctrl tv-ctrl--skip tv-focusable" id="tvSkipBack" type="button" aria-label="Skip back 10 seconds" data-skip="-10">
            <svg viewBox="0 0 24 24"><path d="M12.5 3C7.26 3 3 7.26 3 12.5S7.26 22 12.5 22c4.5 0 8.32-3.13 9.35-7.36l-1.94-.38C19.97 18.29 16.54 21 12.5 21 7.81 21 4 17.19 4 12.5S7.81 4 12.5 4c2.29 0 4.37.94 5.86 2.46L16 8h6V2l-2.05 2.05A9.96 9.96 0 0 0 12.5 3z"/><text x="9" y="16" font-size="7" font-weight="700" fill="currentColor" font-family="Inter,sans-serif">10</text></svg>
          </button>

          
          <button class="tv-ctrl tv-ctrl--play tv-focusable" id="tvPlayPause" type="button" aria-label="Play video">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" /></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M7 5h4v14H7zm6 0h4v14h-4z" /></svg>
          </button>

          
          <button class="tv-ctrl tv-ctrl--skip tv-focusable" id="tvSkipForward" type="button" aria-label="Skip forward 10 seconds" data-skip="10">
            <svg viewBox="0 0 24 24"><path d="M11.5 3C16.74 3 21 7.26 21 12.5S16.74 22 11.5 22c-4.5 0-8.32-3.13-9.35-7.36l1.94-.38C4.03 18.29 7.46 21 11.5 21c4.69 0 8.5-3.81 8.5-8.5S16.19 4 11.5 4c-2.29 0-4.37.94-5.86 2.46L8 8H2V2l2.05 2.05A9.96 9.96 0 0 1 11.5 3z"/><text x="9" y="16" font-size="7" font-weight="700" fill="currentColor" font-family="Inter,sans-serif">10</text></svg>
          </button>

          
          <div class="tv-time">
            <span id="tvCurrentTime">0:00</span>
            <span class="tv-time__sep">/</span>
            <span id="tvTotalDuration">0:00</span>
          </div>

          
          <div class="tv-volume-group">
            <button class="tv-ctrl tv-focusable" id="tvMute" type="button" aria-label="Mute">
              <svg class="icon-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm11.5-.8v7.6a4.5 4.5 0 0 0 0-7.6zm0-3v2.1a7 7 0 0 1 0 9.4v2.1a9 9 0 0 0 0-13.6z"/></svg>
              <svg class="icon-muted" viewBox="0 0 24 24" style="display:none"><path d="M4 9v6h4l5 4V5L8 9zm11.2.1 1.4 1.4 1.4-1.4 1.4 1.4-1.4 1.4 1.4-1.4 1.4-1.4 1.4-1.4 1.4-1.4 1.4-1.4 1.4-1.4z"/></svg>
            </button>
            <div class="tv-volume-bar" id="tvVolumeBar" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0">
              <div class="tv-volume-bar__fill" id="tvVolumeFill"></div>
            </div>
          </div>

          
          <button class="tv-ctrl tv-focusable" id="tvNextEp" type="button" aria-label="Next episode" style="margin-left:12px">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
          </button>

          
          <button class="tv-ctrl tv-focusable" id="tvFullscreen" type="button" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm12 3v-3h2v5h-5v-2z"/></svg>
          </button>
        </div>
      </div>

      
      <div class="tv-next-banner is-hidden" id="tvNextBanner" tabindex="0">
        <div>
          <div class="tv-next-banner__text">Up Next</div>
          <div class="tv-next-banner__title" id="tvNextTitle"></div>
        </div>
        <button class="tv-next-banner__btn tv-focusable" id="tvNextBannerBtn" type="button">Watch Now</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "jassub": "https://cdn.jsdelivr.net/npm/jassub@2.5.14/dist/jassub.js",
          "rvfc-polyfill": "https://cdn.jsdelivr.net/npm/rvfc-polyfill@1.0.8/+esm",
          "abslink": "https://cdn.jsdelivr.net/npm/abslink@1.2.2/src/abslink.js",
          "abslink/w3c": "https://cdn.jsdelivr.net/npm/abslink@1.2.2/adapters/w3c.js",
          "throughput": "https://cdn.jsdelivr.net/npm/throughput@1.0.2/+esm"
        }
      }
    </script>
    <script type="module" src="./src/player.js?v=3"></script>
    <script src="./src/env.js"></script>
    <script src="./src/config.js"></script>
    <script src="./src/api.js"></script>
    <script src="./data.js"></script>
    <script src="./src/shared.js"></script>
    <script src="./src/tv-watch.js"></script>
  </body>
</html>
